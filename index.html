<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Drive Resources</title>
  <meta name="description" content="Clean, fast, minimalist Google Drive link storage.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="header-left"></div>

      <!-- Desktop Nav Actions -->
      <div class="desktop-nav">
        <!-- Admin Button (Opens Popup Modal on Home Page) -->
        <button id="adminBtn" class="btn btn-secondary btn-sm" onclick="openAdminModal()" title="Admin Link Manager">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>Admin</span>
        </button>
      </div>

      <!-- Mobile Hamburger Button -->
      <button id="hamburgerBtn" class="btn btn-ghost btn-icon-only mobile-only" onclick="toggleMobileMenu()" aria-label="Toggle navigation menu">
        <svg id="hamburgerIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"/>
          <line x1="4" x2="20" y1="6" y2="6"/>
          <line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Mobile Menu Drawer (Dropdown) -->
    <div id="mobileMenu" class="mobile-menu-drawer">
      <div class="mobile-menu-title">Programs</div>
      <div class="mobile-menu-links">
        <button class="mobile-menu-link active" onclick="selectProgramFromMobile('all')">All</button>
        <button class="mobile-menu-link" onclick="selectProgramFromMobile('APSSDC')">APSSDC</button>
        <button class="mobile-menu-link" onclick="selectProgramFromMobile('APSCHE / SMARTBRIDGE')">APSCHE / SMARTBRIDGE</button>
        <button class="mobile-menu-link" onclick="selectProgramFromMobile('HEXAING')">HEXAING</button>
      </div>
      <div class="mobile-menu-divider"></div>
      <button id="mobileAdminBtn" class="btn btn-primary btn-sm" style="width:100%;" onclick="openAdminFromMobile()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>Admin Portal</span>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container">

    <!-- Filter Chips (Only All, APSSDC, APSCHE / SMARTBRIDGE, HEXAING) -->
    <section class="controls-toolbar" aria-label="Program Filters" style="background:none; border:none; box-shadow:none; padding:0; margin-bottom:1.5rem;">
      <div id="categoryChips" class="category-chips" role="tablist" aria-label="Program Filters" style="padding-top:0;">
        <button class="category-chip active" data-program="all">All</button>
        <button class="category-chip" data-program="APSSDC">APSSDC</button>
        <button class="category-chip" data-program="APSCHE / SMARTBRIDGE">APSCHE / SMARTBRIDGE</button>
        <button class="category-chip" data-program="HEXAING">HEXAING</button>
      </div>
    </section>

    <!-- Cards Grid -->
    <section id="resourceGrid" class="resource-grid" aria-live="polite">
      <!-- Injected via app.js -->
    </section>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state" style="display: none; border:none; padding: 2rem 0; background: transparent;"></div>

  </main>

  <!-- ======================================================================== -->
  <!-- ADMIN POPUP MODAL                                                        -->
  <!-- ======================================================================== -->
  <div id="adminModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="adminModalHeading">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="adminModalHeading" class="modal-title">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>Admin Portal</span>
        </h3>
        <button class="btn btn-ghost btn-sm btn-icon-only" onclick="closeAdminModal()" aria-label="Close popup">✕</button>
      </div>

      <!-- State A: Admin Login -->
      <div id="adminLoginSection" class="modal-body">
        <div id="adminLoginAlert" style="display:none; padding:0.55rem 0.8rem; border-radius:6px; background:#fef2f2; color:#b91c1c; font-size:0.8rem; margin-bottom:1rem; border:1px solid #fecaca;"></div>

        <form id="adminLoginForm" onsubmit="handleAdminLoginSubmit(event)">
          <div class="form-group">
            <label class="form-label" for="adminUsername">Username or Email</label>
            <input type="text" id="adminUsername" class="form-input" placeholder="e.g. cse" required autofocus />
          </div>

          <div class="form-group">
            <label class="form-label" for="adminPassword">Password</label>
            <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" required />
          </div>

          <div style="margin-top:1.25rem; display:flex; justify-content:flex-end;">
            <button type="submit" class="btn btn-primary btn-sm">Sign In</button>
          </div>
        </form>
      </div>

      <!-- State B: Admin Add Link Form -->
      <div id="adminDashboardSection" class="modal-body" style="display:none;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.1rem; padding-bottom:0.6rem; border-bottom:1px solid var(--border-color);">
          <div style="display:flex; align-items:center; gap:0.45rem; font-size:0.8rem;">
            <span style="width:7px; height:7px; border-radius:50%; background-color:#10b981;"></span>
            <span>Logged in as <strong>cse</strong></span>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="handleAdminLogout()" style="font-size:0.75rem; padding:0.25rem 0.5rem;">Logout</button>
        </div>

        <!-- Add Link Form -->
        <form id="adminAddForm" onsubmit="handleAddResourceSubmit(event)">
          <div class="form-group">
            <label class="form-label" for="adminTitle">Resource Title *</label>
            <input type="text" id="adminTitle" class="form-input" placeholder="e.g. AWS Handout &amp; Lab Architecture" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="adminCategory">Course / Track *</label>
            <select id="adminCategory" class="form-select" required>
              <optgroup label="APSSDC">
                <option value="APSSDC - AWS">APSSDC - AWS</option>
                <option value="APSSDC - ML USING PYTHON">APSSDC - ML USING PYTHON</option>
                <option value="APSSDC - DATA ANALYTICS USING PYTHON">APSSDC - DATA ANALYTICS USING PYTHON</option>
                <option value="APSSDC - DATA ANALYTICS USING POWERBI">APSSDC - DATA ANALYTICS USING POWERBI</option>
                <option value="APSSDC - PYTHON PROGRAMMING">APSSDC - PYTHON PROGRAMMING</option>
              </optgroup>

              <optgroup label="APSCHE / SMARTBRIDGE">
                <option value="APSCHE / SMARTBRIDGE - FULL STACK DEVELEOPOR MERN STACK">APSCHE / SMARTBRIDGE - FULL STACK DEVELEOPOR MERN STACK</option>
                <option value="APSCHE / SMARTBRIDGE - AIML">APSCHE / SMARTBRIDGE - AIML</option>
                <option value="APSCHE / SMARTBRIDGE - GOOGLE CLOUD GENERATIVE AI">APSCHE / SMARTBRIDGE - GOOGLE CLOUD GENERATIVE AI</option>
                <option value="APSCHE / SMARTBRIDGE - VIBE CODING">APSCHE / SMARTBRIDGE - VIBE CODING</option>
                <option value="APSCHE / SMARTBRIDGE - DATA ANALYTICS WITH TABLEAU">APSCHE / SMARTBRIDGE - DATA ANALYTICS WITH TABLEAU</option>
              </optgroup>

              <optgroup label="HEXAING">
                <option value="HEXAING - AIML">HEXAING - AIML</option>
                <option value="HEXAING - FULL STACK">HEXAING - FULL STACK</option>
              </optgroup>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="adminUrlInput">Google Drive Sharing URL *</label>
            <input type="url" id="adminUrlInput" class="form-input" placeholder="https://drive.google.com/file/d/.../view?usp=sharing" required />
          </div>

          <!-- Live URL Preview -->
          <div id="adminUrlPreview" class="preview-panel" style="display:none;">
            <div class="preview-title">Link Preview</div>
            <div class="preview-grid">
              <div class="preview-item">
                <span class="preview-label">ID:</span>
                <span id="adminPrevId" class="preview-value">-</span>
              </div>
              <div class="preview-item">
                <span class="preview-label">Action:</span>
                <span id="adminPrevNote" class="preview-value">-</span>
              </div>
            </div>
            <div style="margin-top:0.45rem;">
              <button type="button" id="adminPrevOpenBtn" class="btn btn-secondary btn-sm" style="font-size:0.75rem; padding:0.2rem 0.5rem;">Test Open in Drive</button>
            </div>
          </div>

          <div style="margin-top:1.15rem; display:flex; justify-content:flex-end;">
            <button type="submit" id="adminSubmitBtn" class="btn btn-primary btn-sm">Publish Link</button>
          </div>
        </form>

        <!-- Manage Existing Links -->
        <div style="margin-top:1.25rem; padding-top:0.85rem; border-top:1px solid var(--border-color);">
          <div style="font-size:0.775rem; font-weight:600; color:var(--text-secondary); margin-bottom:0.45rem; text-transform:uppercase; letter-spacing:0.04em;">
            Existing Resources
          </div>
          <div id="adminLinksList" style="max-height:150px; overflow-y:auto;">
            <!-- Injected via app.js -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
